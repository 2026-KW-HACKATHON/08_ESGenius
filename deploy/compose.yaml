services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-authenticated}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      ADMIN_SUBJECTS: ${ADMIN_SUBJECTS:-}
    volumes:
      - app_data:/app/storage
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_KAKAO_JAVASCRIPT_KEY: ${VITE_KAKAO_JAVASCRIPT_KEY:?Set Kakao JavaScript key}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set your domain}
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_data:
  caddy_data:
  caddy_config:
